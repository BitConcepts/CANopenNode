# ZTest: integration — full API lifecycle with CAN loopback
CONFIG_ZTEST=y

# CAN + loopback driver (works on native_sim and qemu_x86)
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y

# CANopenNode: core features needed for the integration API
CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_INIT_NODE_ID=5
CONFIG_CANOPENNODE_NMT_CALLBACK_CHANGE=y
CONFIG_CANOPENNODE_NMT_TIMERNEXT=y
CONFIG_CANOPENNODE_EM_PRODUCER=y
CONFIG_CANOPENNODE_EM_HISTORY=y

# Disable auto-start so ZTest controls the lifecycle manually
CONFIG_CANOPENNODE_RT_THREAD_AUTO_START=n

# RT thread — keep it but don't auto-start; tests call canopen_start() directly
CONFIG_CANOPENNODE_RT_THREAD=y

# Logging: enable INFO so failures produce useful output
CONFIG_LOG=y
CONFIG_CANOPEN_LOG_LEVEL_INF=y

# Heap required by CO_new() when CO_USE_GLOBALS=0
CONFIG_HEAP_MEM_POOL_SIZE=8192
