# ZTest: od_interface — pure OD read/write tests (no CAN needed)
CONFIG_ZTEST=y

# CANopenNode: only the OD module is needed — no CAN, no RT thread
CONFIG_CAN=y
CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_RT_THREAD=n
CONFIG_CANOPENNODE_RT_THREAD_AUTO_START=n

# Logging
CONFIG_LOG=y
CONFIG_CANOPEN_LOG_LEVEL_WRN=y
