# ZTest: protocol — NMT bootup, heartbeat, NMT commands, SDO server
CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

# CAN loopback — TX frames immediately reflected as RX
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y

# CANopenNode
CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_INIT_NODE_ID=5
CONFIG_CANOPENNODE_NMT_CALLBACK_CHANGE=y
CONFIG_CANOPENNODE_NMT_TIMERNEXT=y
CONFIG_CANOPENNODE_NMT_STARTUP_TO_OPERATIONAL=y

# Emergency producer (needed for EMCY frame test, CiA 301 §7.2.7)
CONFIG_CANOPENNODE_EM_PRODUCER=y
CONFIG_CANOPENNODE_EM_CALLBACK=y

# SDO server (needed for SDO upload test)
CONFIG_CANOPENNODE_SDO_SERVER_TIMERNEXT=y
CONFIG_CANOPENNODE_SDO_SERVER_TIMEOUT_MS=1000

# Disable auto-start — ZTest controls lifecycle
CONFIG_CANOPENNODE_RT_THREAD_AUTO_START=n
CONFIG_CANOPENNODE_RT_THREAD=y

# Longer RT thread idle so it processes frames quickly in simulation
CONFIG_CANOPENNODE_RT_THREAD_IDLE_MS=1

# Logging
CONFIG_LOG=y
CONFIG_CANOPEN_LOG_LEVEL_INF=y

# Heap for CO_new()
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Increase main thread stack for ZTest
CONFIG_MAIN_STACK_SIZE=4096
