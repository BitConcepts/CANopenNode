# ZTest: config_bridge — enable a representative set of Kconfig options
# so that the bitmask composition tests exercise real bit-setting paths.

CONFIG_ZTEST=y

# CANopenNode top-level (requires CAN, but native_sim provides a virtual CAN)
CONFIG_CAN=y
CONFIG_CANOPENNODE=y

# NMT (exercises CO_CONFIG_NMT bitmask)
CONFIG_CANOPENNODE_NMT_CALLBACK_CHANGE=y
CONFIG_CANOPENNODE_NMT_TIMERNEXT=y

# PDO (exercises CO_CONFIG_PDO bitmask — key paths under test)
CONFIG_CANOPENNODE_RPDO_ENABLE=y
CONFIG_CANOPENNODE_TPDO_ENABLE=y
CONFIG_CANOPENNODE_PDO_OD_IO_ACCESS=y
# Note: PDO_BITWISE_MAPPING is NOT enabled here → tests check the 0 path
# A separate testcase.yaml variant enables it

# Storage (exercises BUG-003 regression — correct prefix)
CONFIG_SETTINGS=y
CONFIG_CANOPENNODE_STORAGE_ENABLE=y
CONFIG_CANOPENNODE_STORAGE_BACKEND_RAM=y

# Minimal required for OD generation stub (no actual EDS path needed for these tests)
CONFIG_CANOPENNODE_EDS_FILE_PATH=""
