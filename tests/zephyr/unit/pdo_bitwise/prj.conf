# ZTest: pdo_bitwise — runtime verification of bitwise PDO mapping
CONFIG_ZTEST=y

CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y

CONFIG_CANOPENNODE=y
CONFIG_CANOPENNODE_RPDO_ENABLE=y
CONFIG_CANOPENNODE_TPDO_ENABLE=y
CONFIG_CANOPENNODE_PDO_OD_IO_ACCESS=y
CONFIG_CANOPENNODE_PDO_BITWISE_MAPPING=y   # the feature under test

CONFIG_CANOPENNODE_RT_THREAD=n
CONFIG_CANOPENNODE_RT_THREAD_AUTO_START=n

CONFIG_LOG=y
CONFIG_CANOPEN_LOG_LEVEL_WRN=y
